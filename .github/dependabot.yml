# Avisa de versiones nuevas con pull requests a main, una vez por semana. Los parches y versiones menores
# llegan juntos en un solo PR; cada versión mayor, en el suyo, porque puede romper algo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node siguen la versión del servidor (24); TypeScript 7 cambia mucho: se sube a mano
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
