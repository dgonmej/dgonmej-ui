# Avisa de versiones nuevas con pull requests a main, una vez por semana. Los parches y versiones menores
# llegan juntos en un solo PR; cada versión mayor, en el suyo, porque puede romper algo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
