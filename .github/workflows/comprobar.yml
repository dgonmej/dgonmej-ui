# Comprueba que el proyecto compila (y pasa tipos y tests donde los hay) en cada pull request y en cada
# push a dev. main está protegida: solo admite cambios con esta comprobación en verde.
name: Comprobar

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: comprobar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilar la librería
        run: npm run build
      - name: Compilar la demo
        run: npm run build:demo
